name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch pytest
      - name: Compile Python sources
        run: python -m compileall -q baja_weather scripts tests
      - name: Run unit tests
        run: pytest -q
      - name: Run end-to-end synthetic smoke test
        run: python scripts/run_synthetic_eval.py --epochs 1 --timesteps 220

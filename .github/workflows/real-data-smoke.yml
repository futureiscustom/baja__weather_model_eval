name: real-data-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/real-data-smoke.yml'
      - 'requirements.txt'
      - 'baja_weather/**'
      - 'scripts/prepare_era5_baja.py'
      - 'scripts/train_era5.py'
      - 'scripts/eval_era5.py'

jobs:
  real-era5-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=1.26,<3' 'xarray>=2024.11.0' 'zarr>=2.18,<3' 'numcodecs<0.16.0' 'gcsfs>=2024.6' 'fsspec>=2024.6'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch a small real ERA5 Baja slice
        run: |
          python scripts/prepare_era5_baja.py \
            --start 2020-01-01 \
            --end 2020-01-31 \
            --output /tmp/era5_baja_smoke.npz
      - name: Train one epoch on real ERA5
        run: python scripts/train_era5.py --data /tmp/era5_baja_smoke.npz --epochs 1 --hidden 16
      - name: Run frozen real-data evaluator
        run: |
          python scripts/eval_era5.py \
            --data /tmp/era5_baja_smoke.npz \
            --checkpoint artifacts/era5_tinyweathernet.pt \
            --output /tmp/era5_smoke_eval.json
      - name: Show real-data smoke result
        run: cat /tmp/era5_smoke_eval.json
